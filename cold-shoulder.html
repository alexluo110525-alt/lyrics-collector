<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cold Shoulder – FOMO</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --text-dim: #8e8e93;
      --accent: #fa2d48;
      --glass: rgba(255,255,255,0.08);
      --line-size: 21px;
      --line-active: 23px;
      --line-gap: 18px;
      --btn-size: 54px;
      --ctrl-gap: 32px;
      --side-btn: 22px;
      --edit-btn: 28px;
      --radius: 10px;
    }

    /* ========== Phone Mode ========== */
    body.mode-phone {
      --line-size: 20px;
      --line-active: 22px;
      --line-gap: 16px;
      --btn-size: 58px;
      --ctrl-gap: 28px;
      --side-btn: 24px;
      --edit-btn: 34px;
      --radius: 12px;
    }

    /* ========== Tablet Mode ========== */
    body.mode-tablet {
      --line-size: 23px;
      --line-active: 25px;
      --line-gap: 20px;
      --btn-size: 60px;
      --ctrl-gap: 40px;
      --side-btn: 24px;
      --edit-btn: 32px;
      --radius: 12px;
    }

    /* ========== Desktop Mode ========== */
    body.mode-desktop {
      --line-size: 22px;
      --line-active: 24px;
      --line-gap: 20px;
      --btn-size: 52px;
      --ctrl-gap: 36px;
      --side-btn: 20px;
      --edit-btn: 26px;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1c0a10 0%, #000 45%);
      position: relative;
    }

    body.mode-desktop .app {
      max-width: 480px;
      border-left: 1px solid #111;
      border-right: 1px solid #111;
    }

    body.mode-tablet .app {
      max-width: 640px;
    }

    /* Header */
    .header {
      padding: 14px 16px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--glass);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      text-decoration: none;
    }

    body.mode-phone .icon-btn {
      width: 42px;
      height: 42px;
      font-size: 18px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.85;
    }

    /* Mode Switcher */
    .mode-switcher {
      display: flex;
      gap: 4px;
      background: var(--glass);
      padding: 3px;
      border-radius: 20px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
    }

    body.mode-phone .mode-btn {
      padding: 6px 9px;
      font-size: 12px;
    }

    /* Song Info */
    .song-info {
      text-align: center;
      padding: 4px 20px 10px;
    }

    .song-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    body.mode-tablet .song-title { font-size: 24px; }
    body.mode-phone .song-title { font-size: 19px; }

    .song-artist {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* Lyrics */
    .lyrics-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 7%, #000 76%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 7%, #000 76%, transparent 100%);
    }

    .lyrics-scroll {
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 28px 16px 170px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .lyrics-scroll::-webkit-scrollbar { display: none; }

    .lyric-line {
      font-size: var(--line-size);
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-dim);
      margin-bottom: var(--line-gap);
      transition: all 0.3s ease;
      opacity: 0.4;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
    }

    body.mode-phone .lyric-line {
      padding: 10px 12px;
    }

    .lyric-line.active {
      color: #fff;
      opacity: 1;
      font-size: var(--line-active);
    }

    .lyric-line.past { opacity: 0.25; }

    .lyric-line.selected {
      background: rgba(250, 45, 72, 0.18);
      border: 1px solid var(--accent);
    }

    .lyric-text { flex: 1; }

    .time-label {
      font-size: 12px;
      color: var(--text-dim);
      min-width: 40px;
      padding-top: 4px;
      font-variant-numeric: tabular-nums;
      display: none;
    }

    .edit-controls {
      display: none;
      gap: 6px;
      flex-shrink: 0;
    }

    .edit-btn {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      width: var(--edit-btn);
      height: var(--edit-btn);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .edit-btn.set {
      width: auto;
      padding: 0 10px;
      font-size: 12px;
      background: var(--accent);
      border-color: var(--accent);
    }

    body.editing .time-label,
    body.editing .edit-controls {
      display: flex;
    }

    body.editing .lyric-line {
      font-size: 16px;
      margin-bottom: 12px;
    }

    body.mode-phone.editing .lyric-line {
      font-size: 15px;
    }

    body.editing .lyric-line.active {
      font-size: 17px;
    }

    /* Player */
    .player {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.97) 65%, transparent);
      z-index: 30;
    }

    body.mode-phone .player {
      padding: 12px 14px 28px;
    }

    .progress-bar {
      height: 5px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      cursor: pointer;
      margin-bottom: 8px;
      overflow: hidden;
      touch-action: none;
    }

    body.mode-phone .progress-bar {
      height: 6px;
    }

    .progress-fill {
      height: 100%;
      background: #fff;
      width: 0%;
      border-radius: 3px;
    }

    .progress-bar:hover .progress-fill { background: var(--accent); }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--ctrl-gap);
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .play-btn {
      width: var(--btn-size);
      height: var(--btn-size);
      border-radius: 50%;
      background: #fff;
      color: #000;
    }

    .play-btn svg, .ctrl-btn svg {
      width: var(--side-btn);
      height: var(--side-btn);
    }

    .edit-toggle {
      position: absolute;
      top: 14px;
      right: 56px;
      background: var(--glass);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 25;
      touch-action: manipulation;
    }

    body.mode-phone .edit-toggle {
      padding: 8px 14px;
      font-size: 13px;
      right: 60px;
    }

    body.editing .edit-toggle {
      background: var(--accent);
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      display: none;
      line-height: 1.4;
    }

    body.editing .hint {
      display: block;
    }

    body.mode-phone .hint {
      font-size: 12px;
    }
  </style>
</head>
<body class="mode-phone">
  <div class="app">
    <div class="header">
      <a href="index.html" class="icon-btn">←</a>
      <div class="mode-switcher" id="modeSwitcher">
        <button class="mode-btn" data-mode="phone">Phone</button>
        <button class="mode-btn" data-mode="tablet">Tablet</button>
        <button class="mode-btn" data-mode="desktop">Desktop</button>
      </div>
      <div style="width:38px"></div>
    </div>

    <button class="edit-toggle" id="editToggle">Edit Timing</button>

    <div class="song-info">
      <div class="song-title">Cold Shoulder</div>
      <div class="song-artist">Drake ft. Don Toliver</div>
    </div>

    <div class="lyrics-wrapper">
      <div class="lyrics-scroll" id="lyricsScroll"></div>
    </div>

    <div class="player">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">3:29</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prevBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="hint">
        Select a line → use − / + or Set<br>
        Following lines will shift together automatically
      </div>
    </div>
  </div>

  <audio id="audio" src="cold-shoulder.m4a" preload="auto"></audio>

  <script>
    // ========== Mode System ==========
    const modeSwitcher = document.getElementById('modeSwitcher');
    const modeBtns = modeSwitcher.querySelectorAll('.mode-btn');

    function setMode(mode) {
      document.body.classList.remove('mode-phone', 'mode-tablet', 'mode-desktop');
      document.body.classList.add('mode-' + mode);
      modeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      localStorage.setItem('fomo-display-mode', mode);
    }

    // Auto detect on first load
    function detectMode() {
      const saved = localStorage.getItem('fomo-display-mode');
      if (saved) return saved;

      const w = window.innerWidth;
      if (w < 600) return 'phone';
      if (w < 900) return 'tablet';
      return 'desktop';
    }

    setMode(detectMode());

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    // ========== Lyrics Data ==========
    const defaultLyrics = [
      { time: 0.0,  text: "I'd trade my dreams for something good" },
      { time: 3.5,  text: "Come back" },
      { time: 6.2,  text: "This shit to us is a regular night" },

      { time: 12.8, text: "Niggas went dark, but I'm shedding some light" },
      { time: 16.0, text: "Broski would do anythin' to get him some stripes" },
      { time: 19.2, text: "Shawty said they pullin' us, she better be right" },
      { time: 22.5, text: "We missed the last time, but we'll get 'em tonight" },
      { time: 25.7, text: "Why can't you be with me every night?" },
      { time: 28.9, text: "Ever since you left me, I'm losin' my mind, uh" },
      { time: 32.8, text: "Come back" },
      { time: 35.2, text: "I promise this ain't over" },
      { time: 38.3, text: "You're givin' me the cold shoulder" },
      { time: 42.5, text: "Come back, come back" },
      { time: 45.5, text: "I promise this ain't over" },
      { time: 48.6, text: "You're givin' me the cold shoulder" },
      { time: 53.5, text: "Please come rock me back, please come take me home" },
      { time: 58.8, text: "Please come do me wrong, please come do me wrong" },
      { time: 63.2, text: "This a movie role, I got a doobie rolled" },
      { time: 66.6, text: "You know what it do with me, love" },
      { time: 69.6, text: "You know what to do with me, love" },
      { time: 72.6, text: "On the road I sing the same songs" },
      { time: 75.5, text: "Don't leave me out, don't leave me 'lone, yeah" },
      { time: 78.8, text: "I don't know who to put the blame on" },
      { time: 82.2, text: "Stop, wait, hang on" },
      { time: 84.2, text: "Hold on" },
      { time: 85.8, text: "Let's get high and say we're indicted" },
      { time: 89.2, text: "Let's get high and jump one way" },
      { time: 92.2, text: "Let's get high, go do it, baby" },
      { time: 95.1, text: "Let's get high and go to Tropez" },
      { time: 98.0, text: "In the casa, sittin' sideways" },
      { time: 100.9,text: "Love your ass, call you pet names" },
      { time: 104.3,text: "You've been wearin' all that pride on your sleeve" },
      { time: 107.7,text: "I see so much pride on your face" },
      { time: 110.7,text: "Should've just went to the parade" },
      { time: 113.7,text: "Oh, I blame July for your waist, rainbow face paint" },
      { time: 118.0,text: "It's pink stuff in your nose" },
      { time: 120.5,text: "Yeah, it's pink stuff in your nose" },
      { time: 123.4,text: "History repeats itself, but I don't" },
      { time: 126.4,text: "The mouthpiece that you got on you is wide open" },
      { time: 129.8,text: "Say you wanna change your life, then why don't you?" },
      { time: 133.4,text: "Come back" },
      { time: 135.4,text: "Promise this ain't over" },
      { time: 137.9,text: "You're givin' me the cold shoulder" },
      { time: 142.2,text: "Come back" },
      { time: 144.2,text: "Promise this ain't over" },
      { time: 146.7,text: "You're givin' me the cold shoulder" },
      { time: 151.8,text: "Oh-woah, oh-woah" },
      { time: 154.8,text: "Cold, oh-woah" },
      { time: 157.8,text: "Oh-woah, oh, you're givin' me the" },
      { time: 161.3,text: "Cold, oh-woah, oh-woah" },
      { time: 164.8,text: "Oh-woah, oh, you're givin' me the" },
      { time: 168.3,text: "Cold, oh-woah" },
      { time: 171.3,text: "Oh-woah, oh, you're givin' me the" },
      { time: 174.8,text: "Cold, oh-woah" },
      { time: 181.0,text: "Oh, I don't need a car" },
      { time: 188.0,text: "Oh, I don't need a car" }
    ];

    let lyricsData = JSON.parse(localStorage.getItem('fomo-cold-shoulder-v2')) || defaultLyrics;
    let selectedIndex = -1;
    let isEditing = false;
    let currentIndex = -1;

    const audio = document.getElementById('audio');
    const lyricsScroll = document.getElementById('lyricsScroll');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const editToggle = document.getElementById('editToggle');

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function saveTimings() {
      localStorage.setItem('fomo-cold-shoulder-v2', JSON.stringify(lyricsData));
    }

    function renderLyrics() {
      lyricsScroll.innerHTML = lyricsData.map((line, i) => `
        <div class="lyric-line ${i === selectedIndex ? 'selected' : ''}" data-index="${i}">
          <div class="time-label">${formatTime(line.time)}</div>
          <div class="lyric-text">${line.text}</div>
          <div class="edit-controls">
            <button class="edit-btn" data-action="minus">−</button>
            <button class="edit-btn" data-action="plus">+</button>
            <button class="edit-btn set" data-action="set">Set</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.lyric-line').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.edit-controls')) return;
          const idx = parseInt(el.dataset.index);

          if (isEditing) {
            selectedIndex = idx;
            renderLyrics();
            updateLyrics(audio.currentTime);
          } else {
            audio.currentTime = lyricsData[idx].time;
          }
        });
      });

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const lineEl = btn.closest('.lyric-line');
          const idx = parseInt(lineEl.dataset.index);
          const action = btn.dataset.action;
          const oldTime = lyricsData[idx].time;
          let newTime = oldTime;

          if (action === 'minus') newTime = Math.max(0, oldTime - 0.3);
          else if (action === 'plus') newTime = oldTime + 0.3;
          else if (action === 'set') newTime = audio.currentTime;

          const delta = newTime - oldTime;
          lyricsData[idx].time = newTime;

          // Cascade shift following lines
          if (delta !== 0) {
            for (let i = idx + 1; i < lyricsData.length; i++) {
              lyricsData[i].time = Math.max(0, lyricsData[i].time + delta);
            }
          }

          selectedIndex = idx;
          saveTimings();
          renderLyrics();
          updateLyrics(audio.currentTime);
        });
      });
    }

    function updateLyrics(time) {
      let newIndex = -1;
      for (let i = lyricsData.length - 1; i >= 0; i--) {
        if (time >= lyricsData[i].time) {
          newIndex = i;
          break;
        }
      }

      if (newIndex === currentIndex && !isEditing) return;

      const lines = document.querySelectorAll('.lyric-line');
      lines.forEach((line, i) => {
        line.classList.remove('active', 'past');
        if (i === newIndex) line.classList.add('active');
        else if (i < newIndex) line.classList.add('past');
      });

      if (newIndex >= 0 && !isEditing) {
        const active = lines[newIndex];
        if (active) {
          const containerH = lyricsScroll.clientHeight;
          const scrollTo = active.offsetTop - containerH / 2 + active.offsetHeight / 2;
          lyricsScroll.scrollTo({ top: Math.max(0, scrollTo), behavior: 'smooth' });
        }
      }
      currentIndex = newIndex;
    }

    function updateProgress() {
      const time = audio.currentTime;
      const duration = audio.duration || 209;
      progressFill.style.width = (time / duration * 100) + '%';
      currentTimeEl.textContent = formatTime(time);
      updateLyrics(time);
    }

    // Edit Toggle
    editToggle.addEventListener('click', () => {
      isEditing = !isEditing;
      document.body.classList.toggle('editing', isEditing);
      editToggle.textContent = isEditing ? 'Done' : 'Edit Timing';
      selectedIndex = -1;
      renderLyrics();
    });

    // Player events
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    // Progress bar - support both mouse and touch
    function seekFromEvent(e) {
      const rect = progressBar.getBoundingClientRect();
      let clientX;
      if (e.touches && e.touches.length) clientX = e.touches[0].clientX;
      else clientX = e.clientX;
      const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      audio.currentTime = percent * (audio.duration || 209);
    }

    progressBar.addEventListener('click', seekFromEvent);
    progressBar.addEventListener('touchstart', (e) => { e.preventDefault(); seekFromEvent(e); }, { passive: false });
    progressBar.addEventListener('touchmove', (e) => { e.preventDefault(); seekFromEvent(e); }, { passive: false });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) audio.currentTime = lyricsData[currentIndex - 1].time;
      else audio.currentTime = 0;
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < lyricsData.length - 1) {
        audio.currentTime = lyricsData[currentIndex + 1].time;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      }
    });

    // Init
    renderLyrics();
    updateLyrics(0);
  </script>
</body>
</html>
