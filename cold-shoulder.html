<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cold Shoulder – FOMO</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --text-dim: #8e8e93;
      --accent: #fa2d48;
      --glass: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1c0a10 0%, #000 45%);
      position: relative;
    }

    /* Header */
    .header {
      padding: 16px 18px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--glass);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.85;
    }

    /* Song Info */
    .song-info {
      text-align: center;
      padding: 6px 24px 14px;
    }

    .song-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .song-artist {
      font-size: 14px;
      color: var(--text-dim);
    }

    /* Lyrics */
    .lyrics-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 8%, #000 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 8%, #000 80%, transparent 100%);
    }

    .lyrics-scroll {
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 40px 20px 150px;
      scrollbar-width: none;
    }

    .lyrics-scroll::-webkit-scrollbar { display: none; }

    .lyric-line {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-dim);
      margin-bottom: 20px;
      transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      opacity: 0.4;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .lyric-line.active {
      color: #fff;
      opacity: 1;
      font-size: 24px;
    }

    .lyric-line.past { opacity: 0.25; }

    .lyric-text { flex: 1; }

    /* Edit Mode elements */
    .time-label {
      font-size: 12px;
      color: var(--text-dim);
      min-width: 42px;
      padding-top: 4px;
      font-variant-numeric: tabular-nums;
      display: none;
    }

    .edit-controls {
      display: none;
      gap: 6px;
      flex-shrink: 0;
    }

    .edit-btn {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-btn.set {
      width: auto;
      padding: 0 8px;
      font-size: 11px;
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Show edit UI when editing */
    body.editing .time-label,
    body.editing .edit-controls {
      display: flex;
    }

    body.editing .lyric-line {
      font-size: 17px;
      margin-bottom: 14px;
    }

    body.editing .lyric-line.active {
      font-size: 18px;
    }

    /* Player */
    .player {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 20px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.97) 65%, transparent);
      z-index: 30;
    }

    .progress-bar {
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      cursor: pointer;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #fff;
      width: 0%;
      border-radius: 2px;
    }

    .progress-bar:hover .progress-fill { background: var(--accent); }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fff;
      color: #000;
    }

    .play-btn svg, .ctrl-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Edit Toggle */
    .edit-toggle {
      position: absolute;
      top: 16px;
      right: 60px;
      background: var(--glass);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 25;
    }

    body.editing .edit-toggle {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <a href="index.html" class="icon-btn">←</a>
      <div class="header-title">FOMO</div>
      <div style="width:36px"></div>
    </div>

    <button class="edit-toggle" id="editToggle">Edit Timing</button>

    <div class="song-info">
      <div class="song-title">Cold Shoulder</div>
      <div class="song-artist">Drake ft. Don Toliver</div>
    </div>

    <div class="lyrics-wrapper">
      <div class="lyrics-scroll" id="lyricsScroll"></div>
    </div>

    <div class="player">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">3:29</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prevBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio" src="cold-shoulder.m4a" preload="auto"></audio>

  <script>
    // Default timestamps
    const defaultLyrics = [
      { time: 0.0,  text: "I'd trade my dreams for something good" },
      { time: 3.8,  text: "Come back" },
      { time: 6.3,  text: "This shit to us is a regular night" },
      { time: 9.2,  text: "How much do you need to better your life?" },
      { time: 12.9, text: "Niggas went dark, but I'm shedding some light" },
      { time: 16.1, text: "Broski would do anythin' to get him some stripes" },
      { time: 19.3, text: "Shawty said they pullin' us, she better be right" },
      { time: 22.6, text: "We missed the last time, but we'll get 'em tonight" },
      { time: 25.9, text: "Why can't you be with me every night?" },
      { time: 29.1, text: "Ever since you left me, I'm losin' my mind, uh" },
      { time: 33.2, text: "Come back" },
      { time: 35.8, text: "I promise this ain't over" },
      { time: 39.0, text: "You're givin' me the cold shoulder" },
      { time: 43.2, text: "Come back, come back" },
      { time: 46.3, text: "I promise this ain't over" },
      { time: 49.5, text: "You're givin' me the cold shoulder" },
      { time: 54.2, text: "Please come rock me back, please come take me home" },
      { time: 59.8, text: "Please come do me wrong, please come do me wrong" },
      { time: 64.3, text: "This a movie role, I got a doobie rolled" },
      { time: 67.8, text: "You know what it do with me, love" },
      { time: 70.9, text: "You know what to do with me, love" },
      { time: 74.0, text: "On the road I sing the same songs" },
      { time: 77.0, text: "Don't leave me out, don't leave me 'lone, yeah" },
      { time: 80.4, text: "I don't know who to put the blame on" },
      { time: 83.8, text: "Stop, wait, hang on" },
      { time: 85.8, text: "Hold on" },
      { time: 87.3, text: "Let's get high and say we're indicted" },
      { time: 90.8, text: "Let's get high and jump one way" },
      { time: 93.9, text: "Let's get high, go do it, baby" },
      { time: 96.9, text: "Let's get high and go to Tropez" },
      { time: 99.9, text: "In the casa, sittin' sideways" },
      { time: 102.9,text: "Love your ass, call you pet names" },
      { time: 106.4,text: "You've been wearin' all that pride on your sleeve" },
      { time: 109.9,text: "I see so much pride on your face" },
      { time: 113.0,text: "Should've just went to the parade" },
      { time: 116.1,text: "Oh, I blame July for your waist, rainbow face paint" },
      { time: 120.6,text: "It's pink stuff in your nose" },
      { time: 123.2,text: "Yeah, it's pink stuff in your nose" },
      { time: 126.2,text: "History repeats itself, but I don't" },
      { time: 129.3,text: "The mouthpiece that you got on you is wide open" },
      { time: 132.8,text: "Say you wanna change your life, then why don't you?" },
      { time: 136.5,text: "Come back" },
      { time: 138.6,text: "Promise this ain't over" },
      { time: 141.2,text: "You're givin' me the cold shoulder" },
      { time: 145.6,text: "Come back" },
      { time: 147.7,text: "Promise this ain't over" },
      { time: 150.3,text: "You're givin' me the cold shoulder" },
      { time: 155.5,text: "Oh-woah, oh-woah" },
      { time: 158.6,text: "Cold, oh-woah" },
      { time: 161.7,text: "Oh-woah, oh, you're givin' me the" },
      { time: 165.3,text: "Cold, oh-woah, oh-woah" },
      { time: 168.9,text: "Oh-woah, oh, you're givin' me the" },
      { time: 172.5,text: "Cold, oh-woah" },
      { time: 175.6,text: "Oh-woah, oh, you're givin' me the" },
      { time: 179.2,text: "Cold, oh-woah" },
      { time: 185.5,text: "Oh, I don't need a car" },
      { time: 192.8,text: "Oh, I don't need a car" }
    ];

    // Load saved timings from localStorage
    let lyricsData = JSON.parse(localStorage.getItem('cold-shoulder-timings')) || defaultLyrics;

    const audio = document.getElementById('audio');
    const lyricsScroll = document.getElementById('lyricsScroll');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const editToggle = document.getElementById('editToggle');

    let currentIndex = -1;
    let isEditing = false;

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function saveTimings() {
      localStorage.setItem('cold-shoulder-timings', JSON.stringify(lyricsData));
    }

    function renderLyrics() {
      lyricsScroll.innerHTML = lyricsData.map((line, i) => `
        <div class="lyric-line" data-index="${i}">
          <div class="time-label">${formatTime(line.time)}</div>
          <div class="lyric-text">${line.text}</div>
          <div class="edit-controls">
            <button class="edit-btn" data-action="minus">−</button>
            <button class="edit-btn" data-action="plus">+</button>
            <button class="edit-btn set" data-action="set">Set</button>
          </div>
        </div>
      `).join('');

      // Click line to seek
      document.querySelectorAll('.lyric-line').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.edit-controls')) return;
          const idx = parseInt(el.dataset.index);
          audio.currentTime = lyricsData[idx].time;
        });
      });

      // Edit buttons
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const lineEl = btn.closest('.lyric-line');
          const idx = parseInt(lineEl.dataset.index);
          const action = btn.dataset.action;

          if (action === 'minus') {
            lyricsData[idx].time = Math.max(0, lyricsData[idx].time - 0.5);
          } else if (action === 'plus') {
            lyricsData[idx].time += 0.5;
          } else if (action === 'set') {
            lyricsData[idx].time = audio.currentTime;
          }

          saveTimings();
          renderLyrics();
          updateLyrics(audio.currentTime);
        });
      });
    }

    function updateLyrics(time) {
      let newIndex = -1;
      for (let i = lyricsData.length - 1; i >= 0; i--) {
        if (time >= lyricsData[i].time) {
          newIndex = i;
          break;
        }
      }

      if (newIndex === currentIndex) return;

      const lines = document.querySelectorAll('.lyric-line');
      lines.forEach((line, i) => {
        line.classList.remove('active', 'past');
        if (i === newIndex) line.classList.add('active');
        else if (i < newIndex) line.classList.add('past');
      });

      if (newIndex >= 0 && !isEditing) {
        const active = lines[newIndex];
        const containerH = lyricsScroll.clientHeight;
        const scrollTo = active.offsetTop - containerH / 2 + active.offsetHeight / 2;
        lyricsScroll.scrollTo({ top: Math.max(0, scrollTo), behavior: 'smooth' });
      }

      currentIndex = newIndex;
    }

    function updateProgress() {
      const time = audio.currentTime;
      const duration = audio.duration || 209;
      progressFill.style.width = (time / duration * 100) + '%';
      currentTimeEl.textContent = formatTime(time);
      updateLyrics(time);
    }

    // Edit Toggle
    editToggle.addEventListener('click', () => {
      isEditing = !isEditing;
      document.body.classList.toggle('editing', isEditing);
      editToggle.textContent = isEditing ? 'Done' : 'Edit Timing';
    });

    // Player events
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('ended', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audio.currentTime = percent * (audio.duration || 209);
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) audio.currentTime = lyricsData[currentIndex - 1].time;
      else audio.currentTime = 0;
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < lyricsData.length - 1) {
        audio.currentTime = lyricsData[currentIndex + 1].time;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      }
    });

    // Init
    renderLyrics();
    updateLyrics(0);
  </script>
</body>
</html>
