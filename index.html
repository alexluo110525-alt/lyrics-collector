<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cold Shoulder – Drake · 歌词收集</title>
  <style>
    :root {
      --bg: #000000;
      --bg-secondary: #0a0a0a;
      --text: #ffffff;
      --text-dim: #8e8e93;
      --text-active: #ffffff;
      --accent: #fa2d48;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: linear-gradient(180deg, #1a0a0f 0%, #000000 40%, #000000 100%);
    }

    /* Header */
    .header {
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn, .menu-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s;
    }

    .back-btn:hover, .menu-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }

    /* Song info */
    .song-info {
      text-align: center;
      padding: 8px 24px 16px;
    }

    .song-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .song-artist {
      font-size: 15px;
      color: var(--text-dim);
      font-weight: 500;
    }

    /* Lyrics container */
    .lyrics-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 85%, transparent 100%);
    }

    .lyrics-scroll {
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 40px 28px 120px;
      scrollbar-width: none;
    }

    .lyrics-scroll::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-dim);
      margin-bottom: 22px;
      transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      cursor: pointer;
      opacity: 0.45;
      transform-origin: left center;
    }

    .lyric-line.active {
      color: var(--text-active);
      opacity: 1;
      font-size: 26px;
      transform: scale(1.02);
    }

    .lyric-line.past {
      opacity: 0.3;
    }

    .lyric-line:hover {
      opacity: 0.8;
    }

    /* Player bar */
    .player {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 60%, transparent);
      z-index: 20;
    }

    .progress-container {
      margin-bottom: 14px;
    }

    .progress-bar {
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--text);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .progress-bar:hover .progress-fill {
      background: var(--accent);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      opacity: 0.7;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--text);
      color: #000;
    }

    .play-btn svg {
      width: 24px;
      height: 24px;
    }

    .side-btn svg {
      width: 22px;
      height: 22px;
      opacity: 0.9;
    }

    /* Responsive */
    @media (min-width: 600px) {
      .app {
        max-width: 420px;
        border-left: 1px solid rgba(255,255,255,0.06);
        border-right: 1px solid rgba(255,255,255,0.06);
      }
      .lyric-line {
        font-size: 26px;
      }
      .lyric-line.active {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="history.back()" title="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <span class="header-title">歌词收集</span>
      </div>
      <button class="menu-btn" title="更多">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/>
        </svg>
      </button>
    </div>

    <div class="song-info">
      <div class="song-title">Cold Shoulder</div>
      <div class="song-artist">Drake · Don Toliver</div>
    </div>

    <div class="lyrics-wrapper">
      <div class="lyrics-scroll" id="lyricsScroll">
        <!-- Lyrics will be injected here -->
      </div>
    </div>

    <div class="player">
      <div class="progress-container">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">3:29</span>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn side-btn" id="prevBtn" title="上一句">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="播放/暂停">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn side-btn" id="nextBtn" title="下一句">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio" src="cold-shoulder.m4a" preload="auto"></audio>

  <script>
    // Timed lyrics (seconds)
    const lyricsData = [
      { time: 0.0, text: "I'd trade my dreams for something good" },
      { time: 3.5, text: "Come back" },
      { time: 6.2, text: "This shit to us is a regular night" },
      { time: 9.1, text: "How much do you need to better your life?" },
      { time: 12.8, text: "Niggas went dark, but I'm shedding some light" },
      { time: 16.0, text: "Broski would do anythin' to get him some stripes" },
      { time: 19.2, text: "Shawty said they pullin' us, she better be right" },
      { time: 22.5, text: "We missed the last time, but we'll get 'em tonight" },
      { time: 25.8, text: "Why can't you be with me every night?" },
      { time: 29.0, text: "Ever since you left me, I'm losin' my mind, uh" },
      { time: 33.0, text: "Come back" },
      { time: 35.5, text: "I promise this ain't over" },
      { time: 38.8, text: "You're givin' me the cold shoulder" },
      { time: 43.0, text: "Come back, come back" },
      { time: 46.0, text: "I promise this ain't over" },
      { time: 49.2, text: "You're givin' me the cold shoulder" },
      { time: 54.0, text: "Please come rock me back, please come take me home" },
      { time: 59.5, text: "Please come do me wrong, please come do me wrong" },
      { time: 64.0, text: "This a movie role, I got a doobie rolled" },
      { time: 67.5, text: "You know what it do with me, love" },
      { time: 70.5, text: "You know what to do with me, love" },
      { time: 73.5, text: "On the road I sing the same songs" },
      { time: 76.5, text: "Don't leave me out, don't leave me 'lone, yeah" },
      { time: 80.0, text: "I don't know who to put the blame on" },
      { time: 83.5, text: "Stop, wait, hang on" },
      { time: 85.5, text: "Hold on" },
      { time: 87.0, text: "Let's get high and say we're indicted" },
      { time: 90.5, text: "Let's get high and jump one way" },
      { time: 93.5, text: "Let's get high, go do it, baby" },
      { time: 96.5, text: "Let's get high and go to Tropez" },
      { time: 99.5, text: "In the casa, sittin' sideways" },
      { time: 102.5, text: "Love your ass, call you pet names" },
      { time: 106.0, text: "You've been wearin' all that pride on your sleeve" },
      { time: 109.5, text: "I see so much pride on your face" },
      { time: 112.5, text: "Should've just went to the parade" },
      { time: 115.5, text: "Oh, I blame July for your waist, rainbow face paint" },
      { time: 120.0, text: "It's pink stuff in your nose" },
      { time: 122.5, text: "Yeah, it's pink stuff in your nose" },
      { time: 125.5, text: "History repeats itself, but I don't" },
      { time: 128.5, text: "The mouthpiece that you got on you is wide open" },
      { time: 132.0, text: "Say you wanna change your life, then why don't you?" },
      { time: 136.0, text: "Come back" },
      { time: 138.0, text: "Promise this ain't over" },
      { time: 140.5, text: "You're givin' me the cold shoulder" },
      { time: 145.0, text: "Come back" },
      { time: 147.0, text: "Promise this ain't over" },
      { time: 149.5, text: "You're givin' me the cold shoulder" },
      { time: 155.0, text: "Oh-woah, oh-woah" },
      { time: 158.0, text: "Cold, oh-woah" },
      { time: 161.0, text: "Oh-woah, oh, you're givin' me the" },
      { time: 164.5, text: "Cold, oh-woah, oh-woah" },
      { time: 168.0, text: "Oh-woah, oh, you're givin' me the" },
      { time: 171.5, text: "Cold, oh-woah" },
      { time: 174.5, text: "Oh-woah, oh, you're givin' me the" },
      { time: 178.0, text: "Cold, oh-woah" },
      { time: 185.0, text: "Oh, I don't need a car" },
      { time: 192.0, text: "Oh, I don't need a car" }
    ];

    const audio = document.getElementById('audio');
    const lyricsScroll = document.getElementById('lyricsScroll');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = -1;
    let isPlaying = false;

    // Render lyrics
    function renderLyrics() {
      lyricsScroll.innerHTML = lyricsData.map((line, i) => 
        `<div class="lyric-line" data-index="${i}" data-time="${line.time}">${line.text}</div>`
      ).join('');
      
      // Click to seek
      document.querySelectorAll('.lyric-line').forEach(el => {
        el.addEventListener('click', () => {
          const t = parseFloat(el.dataset.time);
          audio.currentTime = t;
          updateLyrics(t);
        });
      });
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function updateLyrics(time) {
      let newIndex = -1;
      for (let i = lyricsData.length - 1; i >= 0; i--) {
        if (time >= lyricsData[i].time) {
          newIndex = i;
          break;
        }
      }

      if (newIndex !== currentIndex) {
        const lines = document.querySelectorAll('.lyric-line');
        lines.forEach((line, i) => {
          line.classList.remove('active', 'past');
          if (i === newIndex) {
            line.classList.add('active');
          } else if (i < newIndex) {
            line.classList.add('past');
          }
        });

        if (newIndex >= 0) {
          const activeLine = lines[newIndex];
          if (activeLine) {
            const containerHeight = lyricsScroll.clientHeight;
            const lineTop = activeLine.offsetTop;
            const lineHeight = activeLine.offsetHeight;
            const scrollTo = lineTop - containerHeight / 2 + lineHeight / 2;
            lyricsScroll.scrollTo({
              top: Math.max(0, scrollTo),
              behavior: 'smooth'
            });
          }
        }
        currentIndex = newIndex;
      }
    }

    function updateProgress() {
      const time = audio.currentTime;
      const duration = audio.duration || 209;
      const percent = (time / duration) * 100;
      progressFill.style.width = percent + '%';
      currentTimeEl.textContent = formatTime(time);
      updateLyrics(time);
    }

    // Events
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('ended', () => {
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        audio.pause();
        isPlaying = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audio.currentTime = percent * (audio.duration || 209);
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        audio.currentTime = lyricsData[currentIndex - 1].time;
      } else {
        audio.currentTime = 0;
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < lyricsData.length - 1) {
        audio.currentTime = lyricsData[currentIndex + 1].time;
      }
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      } else if (e.code === 'ArrowLeft') {
        prevBtn.click();
      } else if (e.code === 'ArrowRight') {
        nextBtn.click();
      }
    });

    // Init
    renderLyrics();
    updateLyrics(0);
  </script>
</body>
</html>
