<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOMO – Drake Unleaked Lyrics</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #222;
      --text: #ffffff;
      --text-dim: #888;
      --accent: #fa2d48;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .album-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-dim);
    }

    /* Song List */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .song-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s, border-color 0.2s;
    }

    .song-card:hover {
      background: #1a1a1a;
      border-color: #333;
    }

    .song-number {
      font-size: 15px;
      color: var(--text-dim);
      width: 24px;
      text-align: center;
    }

    .song-info {
      flex: 1;
    }

    .song-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .song-artist {
      font-size: 13px;
      color: var(--text-dim);
    }

    .song-duration {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* Footer */
    .footer {
      margin-top: 60px;
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="album-tag">Unleaked Album</div>
      <h1>FOMO</h1>
      <p class="subtitle">Drake · Lyrics Collection</p>
    </div>

    <div class="section-title">Tracks</div>

    <a href="cold-shoulder.html" class="song-card">
      <div class="song-number">01</div>
      <div class="song-info">
        <div class="song-title">Cold Shoulder</div>
        <div class="song-artist">Drake ft. Don Toliver</div>
      </div>
      <div class="song-duration">3:29</div>
    </a>

    <!-- Future songs can be added here -->
    <!-- 
    <a href="another-song.html" class="song-card">
      <div class="song-number">02</div>
      <div class="song-info">
        <div class="song-title">Song Title</div>
        <div class="song-artist">Drake</div>
      </div>
      <div class="song-duration">3:12</div>
    </a>
    -->

    <div class="footer">
      FOMO Unleaked Lyrics · Fan-made collection
    </div>
  </div>
</body>
</html>
